<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add / Edit Task — SmartTask</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="add">
<script>try { var p = JSON.parse(localStorage.getItem('smarttask_profile_v1')); if (p && p.theme) document.documentElement.setAttribute('data-theme', p.theme); } catch(e){}</script>

<div class="app-shell">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">S</div><span class="brand-name">SmartTask</span></div>
    <ul class="nav-list">
      <li><a class="nav-link" data-nav="dashboard" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a></li>
      <li><a class="nav-link" data-nav="tasks" href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Tasks</a></li>
      <li><a class="nav-link" data-nav="add" href="task-form.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Add task</a></li>
      <li><a class="nav-link" data-nav="profile" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>Profile</a></li>
    </ul>
    <div class="sidebar-foot">
      <button class="theme-toggle" id="themeToggle"><span>Light mode</span><span class="switch"></span></button>
      <a href="index.html" class="nav-link" style="font-size:12.5px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 19l-7-7 7-7"/><path d="M3 12h18"/></svg>Back to landing</a>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn-icon menu-btn" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div><div class="eyebrow">Task form</div><h1 id="formHeading">Add a new task</h1></div>
      </div>
    </header>

    <main class="page-body">
      <p class="muted" id="formSub" style="margin-bottom:20px;">Fill in the details to add it to your list.</p>

      <form class="form-card" id="taskForm" novalidate>
        <div class="form-row">
          <label for="title">Task title <span class="req">*</span></label>
          <input type="text" id="title" name="title" placeholder="e.g. Finish algorithms assignment" maxlength="80">
          <div class="field-error-msg" data-error-for="title"></div>
        </div>

        <div class="form-row">
          <label for="description">Description</label>
          <textarea id="description" name="description" placeholder="Add any extra detail — what's involved, links, notes…"></textarea>
          <div class="char-count"><span id="charCount">0 / 500</span></div>
          <div class="field-error-msg" data-error-for="description"></div>
        </div>

        <div class="form-grid-2">
          <div class="form-row">
            <label for="category">Category <span class="req">*</span></label>
            <select id="category" name="category"></select>
            <div class="field-error-msg" data-error-for="category"></div>
          </div>
          <div class="form-row">
            <label for="priority">Priority <span class="req">*</span></label>
            <select id="priority" name="priority">
              <option value="">Select priority</option>
              <option value="low">Low</option>
              <option value="medium">Medium</option>
              <option value="high">High</option>
            </select>
            <div class="field-error-msg" data-error-for="priority"></div>
          </div>
        </div>

        <div class="form-grid-2">
          <div class="form-row">
            <label for="dueDate">Due date <span class="req">*</span></label>
            <input type="date" id="dueDate" name="dueDate">
            <div class="field-error-msg" data-error-for="dueDate"></div>
          </div>
          <div class="form-row">
            <label for="status">Status <span class="req">*</span></label>
            <select id="status" name="status">
              <option value="pending">Pending</option>
              <option value="in-progress">In progress</option>
              <option value="completed">Completed</option>
            </select>
            <div class="field-error-msg" data-error-for="status"></div>
          </div>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">Add task</button>
          <button type="button" class="btn btn-ghost" id="cancelBtn">Cancel</button>
          <button type="button" class="btn btn-danger" id="deleteBtn" style="display:none;margin-left:auto;">Delete task</button>
        </div>
      </form>
    </main>

    <nav class="bottom-nav">
      <a data-nav="dashboard" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
      <a data-nav="tasks" href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Tasks</a>
      <a data-nav="add" href="task-form.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Add</a>
      <a data-nav="profile" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>Profile</a>
    </nav>
  </div>
</div>

<div class="modal-scrim" id="confirmScrim">
  <div class="modal">
    <h3 data-modal-title>Are you sure?</h3>
    <p data-modal-message></p>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" data-modal-cancel>Cancel</button>
      <button class="btn btn-danger btn-sm" data-modal-confirm>Confirm</button>
    </div>
  </div>
</div>

<script src="js/tasks.js"></script>
<script src="js/app.js"></script>
<script src="js/validation.js"></script>
<script src="js/task-form.js"></script>
</body>
</html>
