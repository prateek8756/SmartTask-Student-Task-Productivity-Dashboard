<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks — SmartTask</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="tasks">
<script>try { var p = JSON.parse(localStorage.getItem('smarttask_profile_v1')); if (p && p.theme) document.documentElement.setAttribute('data-theme', p.theme); } catch(e){}</script>

<div class="app-shell">
  <div class="scrim" id="scrim"></div>
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="brand-mark">S</div><span class="brand-name">SmartTask</span></div>
    <ul class="nav-list">
      <li><a class="nav-link" data-nav="dashboard" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a></li>
      <li><a class="nav-link" data-nav="tasks" href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Tasks</a></li>
      <li><a class="nav-link" data-nav="add" href="task-form.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Add task</a></li>
      <li><a class="nav-link" data-nav="profile" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>Profile</a></li>
    </ul>
    <div class="sidebar-foot">
      <button class="theme-toggle" id="themeToggle"><span>Light mode</span><span class="switch"></span></button>
      <a href="index.html" class="nav-link" style="font-size:12.5px;"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10 19l-7-7 7-7"/><path d="M3 12h18"/></svg>Back to landing</a>
    </div>
  </aside>

  <div class="main-col">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:12px;">
        <button class="btn-icon menu-btn" id="menuBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        <div><div class="eyebrow" id="resultCount">0 tasks</div><h1>Task Management</h1></div>
      </div>
      <a href="task-form.html" class="btn btn-primary btn-sm"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" width="15" height="15"><path d="M12 5v14M5 12h14"/></svg>New task</a>
    </header>

    <main class="page-body">
      <div class="toolbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="search" id="searchInput" placeholder="Search tasks by title or keyword…">
        </div>
        <select id="statusFilter" class="filter-select">
          <option value="">All statuses</option>
          <option value="pending">Pending</option>
          <option value="in-progress">In progress</option>
          <option value="completed">Completed</option>
        </select>
        <select id="categoryFilter" class="filter-select">
          <option value="">All categories</option>
          <option>Assignment</option><option>Exam</option><option>Project</option>
          <option>Reading</option><option>Personal</option><option>Other</option>
        </select>
        <select id="priorityFilter" class="filter-select">
          <option value="">All priorities</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>
        <select id="sortSelect" class="filter-select">
          <option value="dueDate">Sort: Due date ↑</option>
          <option value="dueDateDesc">Sort: Due date ↓</option>
          <option value="priority">Sort: Priority</option>
          <option value="created">Sort: Newest added</option>
        </select>
        <div class="view-toggle">
          <button data-view="grid" title="Card view"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg></button>
          <button data-view="table" title="Table view"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
        </div>
      </div>

      <div class="task-grid" id="gridView"></div>

      <table class="task-table" id="tableView" style="display:none;">
        <thead><tr><th>Title</th><th>Category</th><th>Priority</th><th>Due</th><th>Status</th><th>Actions</th></tr></thead>
        <tbody></tbody>
      </table>

      <div class="empty-state" id="emptyState" style="display:none;">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <h3>No tasks match these filters</h3>
        <p>Try clearing a filter or searching for something else.</p>
        <button class="btn btn-ghost btn-sm" id="clearFiltersBtn" style="margin-top:16px;">Clear filters</button>
      </div>
    </main>

    <nav class="bottom-nav">
      <a data-nav="dashboard" href="dashboard.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Dashboard</a>
      <a data-nav="tasks" href="tasks.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Tasks</a>
      <a data-nav="add" href="task-form.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>Add</a>
      <a data-nav="profile" href="profile.html"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 5-6 8-6s6.5 2 8 6"/></svg>Profile</a>
    </nav>
  </div>
</div>

<div class="modal-scrim" id="confirmScrim">
  <div class="modal">
    <h3 data-modal-title>Are you sure?</h3>
    <p data-modal-message></p>
    <div class="modal-actions">
      <button class="btn btn-ghost btn-sm" data-modal-cancel>Cancel</button>
      <button class="btn btn-danger btn-sm" data-modal-confirm>Confirm</button>
    </div>
  </div>
</div>

<script src="js/tasks.js"></script>
<script src="js/app.js"></script>
<script src="js/task-list.js"></script>
</body>
</html>
